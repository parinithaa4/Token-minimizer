services:
  tokenmingate:
    build:
      context: .
      dockerfile: Dockerfile
    image: tokenmingate:latest
    container_name: tokenmingate-gateway
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GATEWAY_DATABASE_URL=sqlite:///app/data/gateway.db
      - SUPABASE_URL=${SUPABASE_URL:-https://eloedezdxtvpkdxebzkc.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tokenmingate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-cache:
