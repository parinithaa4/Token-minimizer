services:
  gateway:
    build: .
    image: llm-gateway:latest
    ports:
      - "8000:8000"
    environment:
      # Point the cache at the bundled Redis. The gateway falls back to an
      # in-memory cache automatically if Redis is unreachable.
      REDIS_URL: "redis://redis:6379/0"
      # Mount and reference a config.yaml to enable real providers; without it
      # the gateway serves the offline mock provider + dev key (sk-gw-dev).
      # GATEWAY_CONFIG: "/app/config.yaml"
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro
    #   - gateway-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

