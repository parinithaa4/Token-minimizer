database_url: "sqlite:///./gateway.db"

cache:
  enabled: true
  ttl_seconds: 3600

providers:
  openai:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: ANTHROPIC_API_KEY

  ollama:
    type: ollama
    base_url: "http://localhost:11434/v1"

  mock:
    type: mock

routing:
  # Real-world cloud & local enterprise model routes
  gpt-4o:
    provider: openai
    upstream_model: gpt-4o
    fallback: mock-echo

  gpt-4o-mini:
    provider: openai
    upstream_model: gpt-4o-mini
    fallback: mock-cheap

  claude-3-5-sonnet:
    provider: anthropic
    upstream_model: claude-3-5-sonnet-20241022
    fallback: mock-echo

  claude-3-5-haiku:
    provider: anthropic
    upstream_model: claude-3-5-haiku-20241022
    fallback: mock-cheap

  gemini-1.5-flash:
    provider: openai
    upstream_model: gemini-1.5-flash
    fallback: mock-cheap

  llama-3.1:
    provider: ollama
    upstream_model: llama3.1:8b
    fallback: mock-cheap

  # Offline/simulation fallbacks
  mock-echo:
    provider: mock
    upstream_model: mock-echo

  mock-cheap:
    provider: mock
    upstream_model: mock-cheap

keys:
  - key: "sk-gw-dev"
    name: dev
    allowed_models: []
    max_usd: 50.0
    cache_enabled: true

semantic_cache:
  enabled: true
  threshold: 0.84
  ttl_seconds: 604800
  model: sentence-transformers/all-MiniLM-L6-v2
  k: 8

complexity_routing:
  enabled: true
  auto_model: tokenmingate

  tier_models:
    economy: gpt-4o-mini
    balanced: claude-3-5-sonnet
    frontier: gpt-4o

default_team_id: platform