database_url: "sqlite:///./gateway.db"

cache:
  enabled: true
  ttl_seconds: 3600

providers:
  mock:
    type: mock

  ollama:
    type: ollama
    base_url: "http://localhost:11434/v1"

routing:
  mock-echo:
    provider: mock
    upstream_model: mock-echo

  qwen-local:
    provider: ollama
    upstream_model: qwen3:8b

  llama-local:
    provider: ollama
    upstream_model: llama3.1:8b

keys:
  - key: "sk-gw-dev"
    name: dev
    allowed_models: []
    max_usd: 10.0
    cache_enabled: true

semantic_cache:
  enabled: true
  threshold: 0.84
  ttl_seconds: 604800
  model: sentence-transformers/all-MiniLM-L6-v2
  k: 8

complexity_routing:
  enabled: true
  auto_model: tokenguard-auto

  tier_models:
    economy: mock-cheap
    balanced: mock-echo
    frontier: mock-echo

default_team_id: default